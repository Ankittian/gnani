<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t">
  <title id="t">Voice pipeline: speak, Prisma speech-to-text, Gemini understands, confirm card, save on device, Timbre speaks the reply</title>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 6 10; animation: flow 0.9s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -16; } }
      .hl { opacity: 0; animation: hl 6s infinite; }
      @keyframes hl { 0% { opacity: 0; } 3% { opacity: 1; } 13% { opacity: 1; } 18% { opacity: 0; } 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="250" rx="24" fill="#f5f2ea"/>
  <text x="40" y="44" font-size="15" font-weight="700" fill="#6a7168" letter-spacing="2">ONE VOICE LOOP, EVERY MODULE</text>

  <!-- connector + travelling dot (drawn behind cards) -->
  <line class="flow" x1="110" y1="140" x2="1090" y2="140" stroke="#14594a" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <circle r="9" fill="#e0a64a" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M110 140 H1090" keyPoints="0;1;1" keyTimes="0;0.8333;1" calcMode="linear"/>
  </circle>

  <!-- cards -->
  <g font-size="19" font-weight="700" fill="#16211c" text-anchor="middle">
    <g>
      <rect x="30" y="88" width="160" height="104" rx="18" fill="#fdfbf6" stroke="#e4dfd2" stroke-width="2"/>
      <rect class="hl" x="30" y="88" width="160" height="104" rx="18" fill="none" stroke="#e0a64a" stroke-width="3" style="animation-delay:0s"/>
      <circle cx="54" cy="112" r="13" fill="#14594a"/><text x="54" y="118" font-size="14" fill="#fff">1</text>
      <text x="110" y="148">Speak</text>
      <text x="110" y="172" font-size="13" font-weight="400" fill="#6a7168">mic → 16 kHz WAV</text>
    </g>
    <g>
      <rect x="226" y="88" width="160" height="104" rx="18" fill="#fdfbf6" stroke="#e4dfd2" stroke-width="2"/>
      <rect class="hl" x="226" y="88" width="160" height="104" rx="18" fill="none" stroke="#e0a64a" stroke-width="3" style="animation-delay:1s"/>
      <circle cx="250" cy="112" r="13" fill="#14594a"/><text x="250" y="118" font-size="14" fill="#fff">2</text>
      <text x="306" y="148">Prisma v3.0</text>
      <text x="306" y="172" font-size="13" font-weight="400" fill="#6a7168">speech → text</text>
    </g>
    <g>
      <rect x="422" y="88" width="160" height="104" rx="18" fill="#fdfbf6" stroke="#e4dfd2" stroke-width="2"/>
      <rect class="hl" x="422" y="88" width="160" height="104" rx="18" fill="none" stroke="#e0a64a" stroke-width="3" style="animation-delay:2s"/>
      <circle cx="446" cy="112" r="13" fill="#14594a"/><text x="446" y="118" font-size="14" fill="#fff">3</text>
      <text x="502" y="148">Gemini</text>
      <text x="502" y="172" font-size="13" font-weight="400" fill="#6a7168">text → Action (zod)</text>
    </g>
    <g>
      <rect x="618" y="88" width="160" height="104" rx="18" fill="#fdfbf6" stroke="#e4dfd2" stroke-width="2"/>
      <rect class="hl" x="618" y="88" width="160" height="104" rx="18" fill="none" stroke="#e0a64a" stroke-width="3" style="animation-delay:3s"/>
      <circle cx="642" cy="112" r="13" fill="#14594a"/><text x="642" y="118" font-size="14" fill="#fff">4</text>
      <text x="698" y="148">Confirm</text>
      <text x="698" y="172" font-size="13" font-weight="400" fill="#6a7168">editable action card</text>
    </g>
    <g>
      <rect x="814" y="88" width="160" height="104" rx="18" fill="#fdfbf6" stroke="#e4dfd2" stroke-width="2"/>
      <rect class="hl" x="814" y="88" width="160" height="104" rx="18" fill="none" stroke="#e0a64a" stroke-width="3" style="animation-delay:4s"/>
      <circle cx="838" cy="112" r="13" fill="#14594a"/><text x="838" y="118" font-size="14" fill="#fff">5</text>
      <text x="894" y="148">Save</text>
      <text x="894" y="172" font-size="13" font-weight="400" fill="#6a7168">IndexedDB, on-device</text>
    </g>
    <g>
      <rect x="1010" y="88" width="160" height="104" rx="18" fill="#14594a"/>
      <rect class="hl" x="1010" y="88" width="160" height="104" rx="18" fill="none" stroke="#e0a64a" stroke-width="3" style="animation-delay:5s"/>
      <circle cx="1034" cy="112" r="13" fill="#e0a64a"/><text x="1034" y="118" font-size="14" fill="#14594a">6</text>
      <text x="1090" y="148" fill="#f4faf7">Timbre v3.0</text>
      <text x="1090" y="172" font-size="13" font-weight="400" fill="#cfe3da">spoken reply</text>
    </g>
  </g>

  <text x="600" y="228" font-size="14" fill="#6a7168" text-anchor="middle">Keys stay on the server · data stays on the phone · every action is confirmed before it touches the khata</text>
</svg>
